	<body class="antialiased">
		<div id="app">
			<div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; z-index: 9999;">
				<div style="width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: #ffffff; box-shadow: 0 10px 25px -5px rgba(23,60,44,0.15); padding: 12px; margin-bottom: 20px; animation: sd-pulse 2s ease-in-out infinite;">
					<img src="/assets/hrms/images/servicedial-logo.webp" alt="ServiceDialTM HRMS" style="max-height: 100%; max-width: 100%; object-fit: contain;">
				</div>
				<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; color: #111827; letter-spacing: -0.4px;">
					ServiceDial<span style="color: #173C2C; font-size: 13px; font-weight: 800; margin-left: 1px;">TM</span>
				</div>
				<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500; color: #6B7280; margin-top: 4px;">
					Enterprise HR &amp; Payroll
				</div>
				<div style="margin-top: 24px; width: 140px; height: 3.5px; background: #F3F4F6; border-radius: 9999px; overflow: hidden; position: relative;">
					<div style="position: absolute; height: 100%; width: 45%; background: linear-gradient(90deg, #173C2C, #2E7D5E); border-radius: 9999px; animation: sd-bar 1.5s ease-in-out infinite;"></div>
				</div>
			</div>
			<style>
				@keyframes sd-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
				@keyframes sd-bar { 0% { left: -45%; } 50% { left: 35%; width: 55%; } 100% { left: 100%; width: 45%; } }
			</style>
		</div>
		<div id="modals"></div>
		<div id="popovers"></div>

		<script>
			window.csrf_token = "{{ csrf_token }}"
			window.site_name = '{{ site_name }}'
			if (!window.frappe) window.frappe = {}
			frappe.boot = {{ boot }}
		</script>
