name: Deploy to Production Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          port: ${{ secrets.DROPLET_PORT }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "Starting deployment on Droplet..."
            export PATH="/home/frappe/.local/bin:/usr/local/bin:$PATH"
            source ~/.bashrc 2>/dev/null || true

            cd /home/frappe/frappe-bench/apps/hrms
            git pull origin main

            echo "Building frontend SPAs..."
            yarn install
            yarn build

            cd /home/frappe/frappe-bench
            echo "Building Desk assets..."
            bench build --app hrms

            echo "Migrating site database..."
            bench --site hrp.servicedialtm.com migrate

            echo "Permanently committing ServiceDialTM branding to Database..."
            bench --site hrp.servicedialtm.com console << 'EOF'
            ws = frappe.get_doc("Website Settings")
            ws.app_name = "ServiceDialTM HRMS"
            ws.app_logo = "/assets/hrms/images/servicedial-logo.webp"
            ws.banner_image = "/assets/hrms/images/servicedial-logo.webp"
            ws.favicon = "/assets/hrms/images/servicedial-favicon.png"
            ws.save(ignore_permissions=True)

            sys = frappe.get_doc("System Settings")
            sys.app_name = "ServiceDialTM HRMS"
            sys.save(ignore_permissions=True)

            nav = frappe.get_doc("Navbar Settings")
            nav.app_logo = "/assets/hrms/images/servicedial-logo.webp"
            nav.save(ignore_permissions=True)

            frappe.db.commit()
            print("Branding committed successfully!")
            EOF

            sudo chmod -R 755 /home/frappe/frappe-bench/sites/assets/
            bench --site hrp.servicedialtm.com clear-cache

            echo "Restarting background workers and web server..."
            sudo supervisorctl restart frappe-bench-web:*
            sudo supervisorctl restart frappe-bench-workers:*

            echo "Deployment completed successfully!"
